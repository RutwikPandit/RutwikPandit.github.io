{{- $thumb := .thumb | default false -}}
{{- if $thumb -}}
<svg viewBox="0 0 268 172" width="268" style="display: block; background: var(--surface); border: 1px solid var(--rule);" role="img" aria-label="Schematic of a collective overlapping a GEMM, with an exposed tail">
  <g font-family="JetBrains Mono, monospace" font-size="8" fill="var(--faint)" letter-spacing="0.8">
    <text x="14" y="24">IDEAL</text>
    <text x="14" y="104">MEASURED</text>
  </g>
  <rect x="14" y="32" width="140" height="15" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-opacity="0.5"></rect>
  <rect x="52" y="53" width="72" height="15" fill="var(--accent2)" fill-opacity="0.16" stroke="var(--accent2)" stroke-opacity="0.5"></rect>
  <rect x="14" y="112" width="176" height="15" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-opacity="0.5"></rect>
  <rect x="52" y="90" width="138" height="15" fill="var(--accent2)" fill-opacity="0.16" stroke="var(--accent2)" stroke-opacity="0.5"></rect>
  <rect x="190" y="90" width="34" height="15" fill="var(--warn)" fill-opacity="0.22" stroke="var(--warn)" stroke-opacity="0.6"></rect>
  <text x="196" y="84" font-family="JetBrains Mono, monospace" font-size="8" fill="var(--warn)">exposed</text>
  <g stroke="var(--rule)" stroke-width="1" stroke-dasharray="2 3">
    <line x1="154" y1="28" x2="154" y2="140"></line>
    <line x1="224" y1="86" x2="224" y2="140"></line>
  </g>
  <line x1="14" y1="140" x2="254" y2="140" stroke="var(--rule)"></line>
</svg>
{{- else -}}
<figure class="figure">
  <div class="frame">
    <svg viewBox="0 0 812 216" width="100%" style="display: block;" role="img" aria-label="Schematic of a collective overlapping a GEMM, showing the GEMM stretched, the collective slowed, and an exposed tail past the ideal makespan">
      <g font-family="JetBrains Mono, monospace" font-size="9.5" fill="var(--faint)" letter-spacing="1">
        <text x="24" y="34">IDEAL</text>
        <text x="24" y="126">MEASURED</text>
        <text x="452" y="192">IDEAL MAKESPAN</text>
        <text x="628" y="192">REAL MAKESPAN</text>
      </g>
      <rect x="24" y="44" width="428" height="22" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)" stroke-opacity="0.5"></rect>
      <rect x="131" y="72" width="214" height="22" fill="var(--accent2)" fill-opacity="0.15" stroke="var(--accent2)" stroke-opacity="0.5"></rect>
      <rect x="24" y="136" width="536" height="22" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)" stroke-opacity="0.5"></rect>
      <rect x="131" y="108" width="429" height="22" fill="var(--accent2)" fill-opacity="0.15" stroke="var(--accent2)" stroke-opacity="0.5"></rect>
      <rect x="560" y="108" width="88" height="22" fill="var(--warn)" fill-opacity="0.2" stroke="var(--warn)" stroke-opacity="0.6"></rect>
      <g font-family="JetBrains Mono, monospace" font-size="9.5" fill="var(--muted)">
        <text x="32" y="59">gemm_large, isolated</text>
        <text x="139" y="87">all_reduce, isolated</text>
        <text x="32" y="151">gemm_large, stretched</text>
        <text x="139" y="123">all_reduce, slowed</text>
      </g>
      <text x="568" y="102" font-family="JetBrains Mono, monospace" font-size="9.5" fill="var(--warn)">exposed</text>
      <g stroke="var(--rule)" stroke-width="1" stroke-dasharray="2 3">
        <line x1="452" y1="38" x2="452" y2="176"></line>
      </g>
      <g stroke="var(--warn)" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="2 3">
        <line x1="648" y1="100" x2="648" y2="176"></line>
      </g>
      <line x1="24" y1="176" x2="788" y2="176" stroke="var(--rule)"></line>
    </svg>
  </div>
  {{- with .caption }}<figcaption>{{ . | safeHTML }}</figcaption>{{ end }}
</figure>
{{- end -}}
