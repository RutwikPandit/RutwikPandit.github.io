<header class="topbar">
  <a class="brand" href="{{ "/" | relURL }}">Rutwik Pandit</a>
  <nav class="topnav">
    {{ $current := . }}
    {{ range site.Menus.main }}
      <a href="{{ .URL }}"{{ if and (ne .URL "mailto:rutwik.pandit@gmail.com") ($current.IsMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{ end }}
    <button class="toggle" id="theme-toggle" type="button" aria-label="Switch between light and dark">
      <svg class="icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"></circle>
        <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"></path>
      </svg>
      <svg class="icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5a6.8 6.8 0 0 0 11.1 11.1z"></path>
      </svg>
    </button>
  </nav>
</header>
